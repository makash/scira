name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: scira-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: scira-darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: scira-darwin-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - name: Install musl tools (linux)
        if: matrix.asset == 'scira-linux-amd64'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Strip and stage
        run: |
          cp target/${{ matrix.target }}/release/scira "${{ matrix.asset }}"
          strip "${{ matrix.asset }}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: |
          chmod +x scira-*
          shasum -a 256 scira-darwin-amd64 scira-darwin-arm64 scira-linux-amd64 > sha256sums.txt
          ls -la
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            scira-darwin-amd64
            scira-darwin-arm64
            scira-linux-amd64
            sha256sums.txt
          body_path: .github/release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
